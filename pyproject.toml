[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photometry"
version = "0.1.0"
description = "Small photometry, source matching, and astronomical image-processing pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2",
    "astroscrappy>=1.3",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "photutils>=2.3",
    "scikit-image>=0.24",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.setuptools]
packages = ["photometry"]
package-dir = { photometry = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
